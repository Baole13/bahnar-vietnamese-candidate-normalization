name: Reproduce E11 results

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reproduce held-out test evaluations
        run: python scripts/evaluate_scores.py --check
      - name: Reproduce validation selection end-to-end
        run: python scripts/val_select.py
      - name: Reproduce Sinkhorn balancing
        run: python scripts/reproduce_sinkhorn_and_subsampling.py --check
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify artifact SHA-256 integrity
        run: python scripts/verify_sha256.py
